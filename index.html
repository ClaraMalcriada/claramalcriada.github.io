  <script>
    // Rolagem para âncoras (#books, #about, #contact) vindas de outras páginas:
    // o React monta depois que o browser tenta pular, então tentamos por ~3s.
    (function () {
      function tryScroll() {
        var hash = window.location.hash;
        if (!hash || hash.length < 2) return false;
        var el = document.querySelector(hash);
        if (el) { el.scrollIntoView(); return true; }
        return false;
      }
      function loop() {
        var n = 0;
        var t = setInterval(function () {
          if (tryScroll() || ++n >= 20) clearInterval(t);
        }, 150);
      }
      window.addEventListener('load', loop);
      window.addEventListener('hashchange', loop);
      if (document.readyState !== 'loading') loop();
    })();
  </script>
